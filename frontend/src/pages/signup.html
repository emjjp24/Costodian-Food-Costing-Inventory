<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Costodian</title>
    <script src="../assets/js/theme.js"></script>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<header class="site-header">
    <a class="brand" href="../../landing.html">
        <!-- PUT YOUR LOGO PHOTO HERE: save it as logo.png in frontend/src/assets/images/ -->
        <img class="brand-logo" src="../assets/images/logo.png" alt="Costodian logo" width="36" height="36">
        <span class="brand-name">Costodian</span>
    </a>
</header>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="auth-page">
        <main class="auth-card wide">
            <a class="logo">
                <img src="../assets/images/add.png" alt="add logo">
            </a>
            <h1>Create your account</h1>
            <p class="tagline">Cost your recipes and track your ingredients. Free to sign up.</p>

            <div id="message" class="alert" role="alert" hidden></div>

            <form id="signup-form" novalidate>

                <fieldset class="type-choice">
                    <legend>What will you use it for?</legend>
                    <div class="type-options">
                        <label class="type-option">
                            <input type="radio" name="account_type" value="personal" checked>
                            <span class="type-box">
                                <strong>Personal use</strong>
                                <small>Home cooking, baking, meal prep</small>
                            </span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="account_type" value="business">
                            <span class="type-box">
                                <strong>Small business</strong>
                                <small>Selling food: stall, bakery, carinderia</small>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <div class="field" id="business-field" hidden>
                    <label for="business_name">Business name</label>
                    <input type="text" id="business_name" name="business_name" maxlength="100" autocomplete="organization">
                </div>

                <div class="field">
                    <label for="full_name">Full name</label>
                    <input type="text" id="full_name" name="full_name" maxlength="100" autocomplete="name">
                </div>

                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" maxlength="50" autocomplete="username">
                    <span class="hint">3 to 50 characters: letters, numbers, dot, dash or underscore.</span>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" maxlength="72" autocomplete="new-password">
                        <button type="button" class="eye" data-for="password" aria-label="Show password">
                            <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/></svg>
                        </button>
                    </div>
                    <span class="hint">At least 6 characters.</span>
                </div>

                <div class="field">
                    <label for="confirm_password">Confirm password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirm_password" name="confirm_password" maxlength="72" autocomplete="new-password">
                        <button type="button" class="eye" data-for="confirm_password" aria-label="Show password">
                            <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">Sign up</button>
            </form>

            <div class="links">
                <p>Already have an account? <a href="../../index.html">Sign in</a></p>
            </div>
        </main>
    </div>

    <script src="../api/client.js"></script>
    <script src="../api/auth.js"></script>
    <script src="../validators/signup.js"></script>
    <script>
        // where to go after a successful sign up (put dashboard.html here when that page exists)
        var AFTER_SIGNUP_PAGE = "../../index.html";

        var form = document.getElementById('signup-form');
        var message = document.getElementById('message');
        var submitBtn = document.getElementById('submit-btn');
        var businessField = document.getElementById('business-field');

        // show a message in the alert box (textContent keeps typed characters from running as HTML)
        function showMessage(text, ok){
            message.textContent = text;
            message.className = ok ? 'alert alert-ok' : 'alert alert-error';
            message.hidden = false;
        }

        // the business name box is only needed for a small business
        function updateBusinessField(){
            businessField.hidden = (form.elements['account_type'].value != 'business');
        }

        form.elements['account_type'].forEach(function(radio){
            radio.addEventListener('change', updateBusinessField);
        });

        // the eye buttons show or hide the password next to them
        document.querySelectorAll('.eye').forEach(function(button){
            button.addEventListener('click', function(){
                var box = document.getElementById(button.getAttribute('data-for'));
                var show = (box.type == 'password');
                box.type = show ? 'text' : 'password';
                button.classList.toggle('shown', show);
                button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        });

        form.addEventListener('submit', function(event){
            event.preventDefault();

            var values = {
                account_type: form.elements['account_type'].value,
                business_name: form.elements['business_name'].value.trim(),
                full_name: form.elements['full_name'].value.trim(),
                username: form.elements['username'].value.trim(),
                password: form.elements['password'].value,
                confirm_password: form.elements['confirm_password'].value
            };

            var error = validateSignupForm(values);
            if(error != ""){
                showMessage(error, false);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating your account...';

            registerUser(values).then(function(reply){
                if(reply.success){
                    showMessage(reply.message, true);
                    form.reset();
                    updateBusinessField();
                    setTimeout(function(){
                        window.location.href = AFTER_SIGNUP_PAGE;
                    }, 1500);
                } else {
                    showMessage(reply.message, false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign up';
                }
            });
        });
    </script>
</body>
</html>
