<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movements | Costodian</title>
    <script src="../assets/js/theme.js"></script>
    <script>
        // the panel was closed last time: keep it closed (this runs before the page is drawn)
        try{
            if(localStorage.getItem('costodian-sidebar') == 'closed'){
                document.documentElement.classList.add('sidebar-collapsed');
            }
        } catch(e){
            // private mode: the panel just starts open
        }
    </script>
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/tables.css">
    <link rel="stylesheet" href="../assets/css/movements.css">
</head>
<body>

    <!-- the panel on the left -->
    <aside class="sidebar" id="sidebar" aria-label="Pages">
        <div class="side-head">
            <a class="side-brand" href="dashboard.html">
                <img src="../assets/images/logo.png" alt="Costodian logo">
                <span>Costodian</span>
            </a>
            <button type="button" class="side-close" id="side-close" aria-label="Close the menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
            </button>
        </div>

        <nav class="side-nav">
            <a class="side-link" href="dashboard.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                Dashboard
            </a>
            <a class="side-link" href="recipes.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2"/><path d="M17 22V2c-3 2-4 5-4 9h4"/></svg>
                Recipes
            </a>
            <a class="side-link" href="inventory.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
                Inventory
            </a>
            <a class="side-link" href="movements.html" aria-current="page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></svg>
                Movements
            </a>
        </nav>

        <!-- the settings button at the bottom of the panel -->
        <div class="side-bottom">
            <div class="settings-menu" id="settings-menu">
                <button type="button" class="menu-item" id="theme-toggle" aria-label="Switch to dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <span class="label-dark">Dark mode</span>
                    <span class="label-light">Light mode</span>
                </button>
                <button type="button" class="menu-item" id="logout-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Log out
                </button>
            </div>

            <button type="button" class="side-link" id="settings-btn" aria-haspopup="true" aria-expanded="false" aria-controls="settings-menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
            </button>
        </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="main">

        <header class="topbar">
            <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open or close the menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>

            <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="search" id="search" placeholder="Search items..." aria-label="Search items">
            </div>

            <div class="top-actions">
                <div class="notif">
                    <button type="button" class="icon-btn" id="bell-btn" aria-label="Items that need attention" aria-expanded="false" aria-controls="notif-menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                        <span class="notif-dot" id="notif-dot" hidden></span>
                    </button>
                    <div class="notif-menu" id="notif-menu">
                        <h2>Needs attention</h2>
                        <ul id="notif-list"></ul>
                    </div>
                </div>

                <div class="user">
                    <div class="avatar" id="avatar" aria-hidden="true">?</div>
                    <div class="user-text">
                        <strong id="user-name">Loading...</strong>
                        <small id="user-role"></small>
                    </div>
                </div>
            </div>
        </header>

        <main class="content">
            <div class="title-row">
                <h1 class="page-title">Stock Movements</h1>
                <p class="page-sub">Everything that went in or out of your inventory.</p>
            </div>

            <div id="page-message" class="alert" role="alert" hidden></div>

            <section class="filters" aria-label="Filters">
                <div class="filter filter-dates">
                    <span class="filter-label">Date Range</span>
                    <div class="range-box">
                        <svg class="range-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                        <input type="date" id="from-date" aria-label="From date">
                        <span class="range-dash">to</span>
                        <input type="date" id="to-date" aria-label="To date">
                    </div>
                    <div class="presets" aria-label="Quick dates">
                        <button type="button" class="preset" data-days="0">Today</button>
                        <button type="button" class="preset" data-days="7">Last 7 days</button>
                        <button type="button" class="preset" data-days="30">Last 30 days</button>
                    </div>
                </div>
                <label class="filter">Movement Type
                    <select id="type-filter">
                        <option value="">All Types</option>
                        <option value="stock_in">Stock In</option>
                        <option value="stock_out">Stock Out</option>
                        <option value="waste">Waste</option>
                        <option value="adjustment">Adjustment</option>
                    </select>
                </label>
                <label class="filter">Item
                    <select id="item-filter">
                        <option value="">All</option>
                    </select>
                </label>
                <button type="button" class="clear-btn" id="clear-filters">Clear filters</button>
            </section>

            <section class="panel" aria-label="Movements">
                <div class="table-wrap">
                    <table class="table mov-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Item Name</th>
                                <th>Movement Type</th>
                                <th>Quantity Changed</th>
                                <th>Performed By</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="movement-rows" aria-live="polite">
                            <tr><td class="empty" colspan="6">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pager-row">
                    <p class="count-text" id="count-text"></p>
                    <nav class="pager" id="pager" aria-label="Pages"></nav>
                </div>
            </section>
        </main>
    </div>

    <!-- the small panel with the details of one movement (opens when a row is tapped) -->
    <dialog id="move-dialog" class="sheet" aria-labelledby="move-title">
        <div class="sheet-head">
            <div>
                <h2 id="move-title">Movement</h2>
                <div id="move-tag"></div>
            </div>
            <button type="button" class="sheet-close" id="move-close" aria-label="Close">&times;</button>
        </div>
        <p class="sheet-qty" id="move-qty"></p>
        <dl class="sheet-list" id="move-list"></dl>
    </dialog>

    <script src="../api/client.js"></script>
    <script src="../api/auth.js"></script>
    <script src="../api/dashboard.js"></script>
    <script src="../api/movements.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/movements-helpers.js"></script>
    <script src="../assets/js/movements-page.js"></script>
</body>
</html>
